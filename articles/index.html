<!DOCTYPE html>
<html lang="ar">
<head>
  <meta charset="UTF-8">
  <title>أثر</title>
</head>
<body style="font-family: Arial; direction: rtl; text-align: center; padding: 50px;">

  <h1>أثر</h1>
  <p>ما تتركه الحياة فينا</p>

  <hr>

  <h2>عن المشروع</h2>
  <p>
    مساحة لفهم الإنسان من الداخل والخارج:
    النفس، المجتمع، السياسة، العالم، وأسئلة المعنى.
  </p>

  <h3>ابدأ من هنا</h3>
  <p>لماذا أصبح الإنسان أكثر هشاشة؟</p>
  <p>هل نحن أحرار أم أسرى طفولتنا؟</p>

</body>
</html>
